[ENA_METADATA]
# Center name for the submission
center_name = Dutch COVID-19 response team
collector_name = Dutch COVID-19 response team

# Static title for each sample
title = SARS-CoV-2 sequence

# Taxonomic information for the organism
taxon_id = 2697049
scientific_name = Severe acute respiratory syndrome coronavirus 2
common_name = Human coronavirus 2019

# Detailed description of the sequencing and library prep methods.
# This can be a multi-line value.
description = A SARS-CoV-2 specfic multiplex PCR for Nanopore sequencing was performed, similar to amplicon-based approaches as previously described. In short, primers for 86 overlapping amplicons spanning the entire genome were designed using primal. The amplicon length was set to 500bp with 75bp overlap between the different amplicons. The libraries were generated using the native barcode kits from Nanopore (EXP-NBD104 and EXP-NBD114 and SQK-LSK109) and sequenced on a R9.4 flow cell multiplexing up to 24 samples per sequence run. Raw data was demultiplexed, amplicon primers were trimmed and human data was removed by mapping against the human reference genome.

